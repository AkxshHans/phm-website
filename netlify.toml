# Netlify builds the site from the text in /content every time something changes (including edits made in /admin).
[build]
  command = "python3 _src/build.py"
  publish = "public"
  functions = "netlify/functions"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
